# Reusable CI workflow that builds every package exposed by a Nix flake
on:
  workflow_call:
    inputs:
      system:
        description: >-
          Nix system to build for (e.g. x86_64-linux). Defaults to the
          runner's own system.
        type: string
        required: false
        default: ''
      exclude:
        description: >-
          Newline-separated list of package names to skip building.
        type: string
        required: false
        default: ''

concurrency:
  group: nix-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
      excludes: ${{ steps.list.outputs.excludes }}
      system: ${{ steps.list.outputs.system }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - id: list
        run: |
          SYSTEM="${{ inputs.system }}"
          if [ -z "$SYSTEM" ]; then
            # Derive the Nix system from the runner.
            SYSTEM="$(uname -m)-$(uname -s | tr '[:upper:]' '[:lower:]')"
          fi
          PACKAGES=$(
            nix eval --json --apply builtins.attrNames \
              ".#packages.${SYSTEM}" 2>/dev/null
          )
          # Drop `default` only when there are other packages
          PACKAGES=$(jq -c 'if length > 1 then map(select(. != "default")) else . end' <<< "$PACKAGES")
          # Turn the newline-separated `exclude` input into a JSON array of
          # matrix-exclude objects for the build job.
          EXCLUDES=$(jq -R -s -c \
            'split("\n") | map(gsub("\\s*#.*$"; "") | gsub("^\\s+|\\s+$"; "")) | map(select(length > 0)) | map({package: .})' \
            <<< "${{ inputs.exclude }}")
          echo "system=$SYSTEM" >> "$GITHUB_OUTPUT"
          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"
          echo "excludes=$EXCLUDES" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover.outputs.packages) }}
        exclude: ${{ fromJson(needs.discover.outputs.excludes) }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Build ${{ matrix.package }}
        run: nix build ".#packages.${{ needs.discover.outputs.system }}.${{ matrix.package }}"
