name: update-flake-lock
on:
  workflow_dispatch: # allows manual triggering
  schedule: # check for flake input updates every 2 hours
    - cron: '0 */2 * * *'
permissions:
  contents: write
  pull-requests: write
jobs:
  lockfile:
    uses: Bazinga9000/chashmal/.github/workflows/update-flake-lock.yaml@main
    with:
      app-client-id: ${{ vars.APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
